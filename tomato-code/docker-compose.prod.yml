services:
  gateway:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      - auth
      - restaurant
      - rider
      - admin
      - utils
      - realtime
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  auth:
    build:
      context: ./services/auth
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5000

  restaurant:
    build:
      context: ./services/restaurant
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5001
      UTILS_SERVICE: http://utils:5002
      REALTIME_SERVICE: http://realtime:5004

  utils:
    build:
      context: ./services/utils
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5002
      RESTAURANT_SERVICE: http://restaurant:5001

  realtime:
    build:
      context: ./services/realtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5004

  rider:
    build:
      context: ./services/rider
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5005
      UTILS_SERVICE: http://utils:5002
      RESTAURANT_SERVICE: http://restaurant:5001
      REALTIME_SERVICE: http://realtime:5004

  admin:
    build:
      context: ./services/admin
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5006

volumes:
  caddy_data:
  caddy_config:
