services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth
      - restaurant
      - rider
      - admin
      - utils
      - realtime
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  auth:
    build:
      context: ./services/auth
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5000

  restaurant:
    build:
      context: ./services/restaurant
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5001
      UTILS_SERVICE: http://utils:5002
      REALTIME_SERVICE: http://realtime:5004

  utils:
    build:
      context: ./services/utils
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5002
      RESTAURANT_SERVICE: http://restaurant:5001

  realtime:
    build:
      context: ./services/realtime
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5004

  rider:
    build:
      context: ./services/rider
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5005
      UTILS_SERVICE: http://utils:5002
      RESTAURANT_SERVICE: http://restaurant:5001
      REALTIME_SERVICE: http://realtime:5004

  admin:
    build:
      context: ./services/admin
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 5006
